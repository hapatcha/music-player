<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://kit.fontawesome.com/01bd3986cc.js" crossorigin="anonymous"></script>
</head>
<body class="main">  
  <div class="container">
    <div class="cn-image"  id="songImg">
    
    </div>
    <div class="cn-name">
        <h5 id="songName" style="margin-left: 10px;">9k32</h5>
        <p id="artist">XIIVI</p>
    </div>
    <div class="cn-audio">
      <div>
        <input type="range" name="" id="progress">
        <audio  id="songPlayer">
          <source src="songs/9K32.mp3" type="audio/mpeg">
        </audio>
      </div>
      <div style="display: flex; justify-content: space-between;">
        <i onclick="previousSong()" class="fa-solid fa-backward"></i>
        <i onclick="playPause()" id="cntrIcon" class="fa-solid fa-play"></i>
        <!-- <i class="fa-solid fa-play"></i> -->
        <i onclick="nextSong()" class="fa-solid fa-forward"></i>
      </div>
    </div>
  </div>
  <script src="scripte.js"></script>
</body>
</html>
